<title>FRS Student Survey</title>

<style>
:root{--bg:#f4f8fc;--card:#fff;--tx:#333;--hd:#005aa7;--mu:#5f6b76;--ac:#005aa7;--teal:#00bed6;--gold:#eab830;--ln:#cfdbe7;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f4f8fc;--card:#fff;--tx:#333}}
:root[data-theme="dark"]{--bg:#f4f8fc}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Open Sans",system-ui,sans-serif}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--ac);color:#fff;font:600 14px Montserrat,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 110px)}
h1{font:800 clamp(26px,7vw,40px)/1.15 Montserrat,sans-serif;color:var(--hd);margin:8px 0 0}
.lead{font-size:clamp(17px,4.4vw,21px);margin:0}
.q{font:700 clamp(19px,5vw,26px)/1.35 Montserrat,sans-serif;color:#222;margin:4px 0}
.pre{color:var(--mu);font-size:15px;margin:0}
.n{margin:0;color:var(--mu);font-weight:600}
.opts{display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.o{min-height:58px;font-size:clamp(17px,4.4vw,20px);text-align:left;padding:12px 16px;background:#fff;border:2px solid var(--ln);border-radius:10px;color:#222;width:100%}
.o:hover,.o:focus-visible{border-color:var(--teal);outline:none}
.o.on{border-color:var(--ac);background:#eaf3fb}
.o.p{background:var(--ac);border-color:var(--ac);color:#fff;text-align:center;font-weight:700}
.back{align-self:flex-start;min-height:42px;padding:6px 14px;border:1px solid var(--ln);background:#fff;border-radius:6px}
.prog{height:10px;border-radius:5px;background:#dfe7ef;overflow:hidden}.prog span{display:block;height:100%;background:var(--gold)}
.code-in{display:flex;gap:8px;flex-wrap:wrap}
.code-in input{flex:1;min-width:0;font:700 28px Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:10px 14px;border:2px solid var(--ln);border-radius:10px;text-align:center;max-width:280px}
.code-in .o{width:auto;min-width:120px}
.msg{color:#a0362b;font-weight:600;min-height:1.5em;margin:0}
.qr{background:#fff;padding:10px;border-radius:12px;border:2px solid var(--ln);width:min(78vw,320px);align-self:center}
.qr svg{display:block;width:100%;height:auto}
.ans{font:800 clamp(28px,8vw,40px) Montserrat,sans-serif;letter-spacing:.08em;color:var(--hd);text-align:center;margin:0}
.center{text-align:center;align-items:center}
footer{max-width:720px;margin:0 auto;padding:10px 16px 18px;font-size:12px;color:var(--mu)}
footer a{color:var(--mu)}
.tb{display:inline-flex;align-items:center;gap:8px}.tmk{width:26px;height:26px;flex:none}
</style>

/* ---------- survey share codes (shared with the student survey page) ----------
   Class code: 5 characters = years in the class (Years 3–12) + start/end + random part + check.
   Answer code: 10 characters = the 10 answers + year + random part + check tied to the class code.
   Codes hold no names or personal information. */
const SVC_A='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const svcNorm=s=>String(s||'').toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1').replace(/U/g,'V');
function svcEnc(n,len){let o='';for(let i=0;i<len;i++){o=SVC_A[n%32]+o;n=Math.floor(n/32)}return o}
function svcDec(s){let n=0;for(const c of s){const v=SVC_A.indexOf(c);if(v<0)return -1;n=n*32+v}return n}
function svcH(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h}
function svcClass(years,phase){const m=years.reduce((a,y)=>a|(1<<(y-3)),0),r=Math.floor(Math.random()*512),p=(m*2+(phase=='post'?1:0))*512+r;return svcEnc(p*32+svcH('c'+p)%32,5)}
function svcClassRead(code){const c=svcNorm(code);if(c.length!=5)return null;const n=svcDec(c);if(n<0)return null;const p=Math.floor(n/32);if(svcH('c'+p)%32!=n%32)return null;
 const mp=Math.floor(p/512),m=Math.floor(mp/2),years=[];for(let i=0;i<10;i++)if(m&(1<<i))years.push(i+3);return years.length?{code:c,years,phase:mp%2?'post':'pre'}:null}
function svcAns(cls,year,ans){let a=0;for(let i=0;i<10;i++)a=a*5+(ans[i]|0);const p=(a*16+(year-3))*2048+Math.floor(Math.random()*2048);return svcEnc(p*2048+svcH(cls+':'+p)%2048,10)}
function svcAnsRead(cls,code){const c=svcNorm(code);if(c.length!=10)return null;const n=svcDec(c);if(n<0)return null;const p=Math.floor(n/2048);if(svcH(cls+':'+p)%2048!=n%2048)return null;
 const q=Math.floor(p/2048),year=q%16+3;let a=Math.floor(q/16);const ans=[];for(let i=9;i>=0;i--){ans[i]=a%5;a=Math.floor(a/5)}return a?null:{code:c,year,ans}}
const svcFmt=c=>c.length==10?c.slice(0,5)+'-'+c.slice(5):c;
function svcQR(text,cell){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:cell||6,margin:2,scalable:true})}

const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let C=null,S={i:-2,ans:[],y:0,b:null,done:''};
const KEY=c=>'frs_sv_'+c;
function load(){try{const r=JSON.parse(localStorage.getItem(KEY(C.code))||'null');if(r&&r.done&&Date.now()-r.t<12*3600e3)S={i:99,ans:[],y:r.y,b:svBand(r.y),done:r.done}}catch(e){}}
function keep(){try{localStorage.setItem(KEY(C.code),JSON.stringify({done:S.done,y:S.y,t:Date.now()}))}catch(e){}}
function forget(){try{localStorage.removeItem(KEY(C.code))}catch(e){}}
function start(code){const c=svcClassRead(code);if(!c)return false;C=c;try{history.replaceState(null,'','#'+c.code)}catch(e){}$('#hdr').textContent='Future Ready Skills survey · '+(c.phase=='post'?'End':'Start')+' of learning';S={i:-1,ans:[],y:0,b:null,done:''};load();render();return true}
function askCode(msg){app.innerHTML=`<h1>Hi! 👋</h1><p class="lead">Type the class code your teacher gave you.</p>
<form class="code-in" onsubmit="event.preventDefault();if(!start(this.c.value)){document.querySelector('.msg').textContent='That code doesn\\'t look right. Check it with your teacher.';this.c.select()}"><input name="c" aria-label="Class code" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC12"><button class="o p">Start</button></form><p class="msg" role="alert">${msg||''}</p>`;app.querySelector('input').focus()}
function render(){
 if(S.i==-1){const ys=C.years;app.innerHTML=`<h1>Hi! 👋</h1><p class="lead">This quick quiz shows what you know about the Future Ready Skills. It is not a test of you, and your name is not recorded.</p><p class="q">Which year are you in?</p><div class="opts">${ys.map(y=>`<button class="o" onclick="S.y=${y};S.b=svBand(${y});S.i=0;S.ans=[];render()">Year ${y}</button>`).join('')}</div>`;return}
 const Q=svQuestions(S.b);
 if(S.i>=0&&S.i<Q.length){const q=Q[S.i],parts=q.q.split('? ');app.innerHTML=`<div class="prog" aria-label="Question ${S.i+1} of ${Q.length}"><span style="width:${Math.round(S.i/Q.length*100)}%"></span></div><p class="n">Question ${S.i+1} of ${Q.length}</p>${parts.length>1&&S.i>=5?`<p class="pre">${esc(parts[0])}?</p><p class="q">${esc(parts.slice(1).join('? '))}</p>`:`<p class="q">${esc(q.q)}</p>`}<div class="opts">${q.o.map((o,j)=>`<button class="o${S.ans[S.i]===j?' on':''}" onclick="S.ans[${S.i}]=${j};S.i++;render()">${esc(o)}</button>`).join('')}</div><button class="back" onclick="S.i--;render()">← Back</button>`;window.scrollTo(0,0);return}
 if(S.i==Q.length){app.innerHTML=`<h1>All done?</h1><p class="lead">Press <b>Get my answer code</b>. You can't change your answers after that.</p><div class="opts"><button class="o p" onclick="finish()">Get my answer code</button><button class="o" onclick="S.i=0;render()">Check my answers</button></div>`;return}
 if(S.done){const txt='FRS:'+C.code+'-'+S.done;app.innerHTML=`<div class="center" style="display:flex;flex-direction:column;gap:12px"><h1>Thank you! ⭐</h1><p class="lead">Show this to your teacher's camera, or read out your code.</p><div class="qr" role="img" aria-label="Answer QR code">${svcQR(txt,8)}</div><p class="ans" aria-label="Answer code">${svcFmt(S.done)}</p><p class="pre">Year ${S.y} · Keep this screen open until your teacher says your answers are saved.</p><button class="back" style="align-self:center" onclick="if(this.dataset.sure){forget();S={i:-1,ans:[],y:0,b:null,done:''};render()}else{this.dataset.sure=1;this.textContent='Tap again to close'}">My teacher has saved it</button></div>`}}
function finish(){for(let i=0;i<10;i++)if(S.ans[i]==null){S.i=i;return render()}S.done=svcAns(C.code,S.y,S.ans);S.i=99;keep();render()}
const h=(location.hash||'').replace(/^#/,''),qs=new URLSearchParams(location.search).get('c');
if(!(h&&start(h))&&!(qs&&start(qs)))askCode();
</script>
